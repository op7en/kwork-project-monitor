# Standalone offline validator, never merge with bot Compose. No state/startup/API.
name: kwork-env-check
services:
  check:
    image: kwork-project-monitor:${KWORK_RELEASE:?Set a tested SHA containing configCheckRun}
    pull_policy: never
    user: "21001:21001"
    init: true
    restart: "no"
    network_mode: none
    read_only: true
    cpus: 0.25
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["node", "dist/ops/configCheckRun.js"]
    env_file:
      - path: ${KWORK_SECRETS_FILE:?Set the private runtime file}
        required: true
        format: raw
